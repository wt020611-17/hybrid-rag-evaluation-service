[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-evaluation-service"
version = "1.0.0"
description = "An evidence-first hybrid RAG service with BM25, vector retrieval, graph paths, RRF, citations, and reproducible evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Tao Wang" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]
production = [
  "python-dotenv>=1.0,<2.0",
  "transformers==4.46.3",
  "pymilvus>=2.5,<2.6",
  "neo4j>=5.18,<6.0",
]

[project.scripts]
hybrid-rag = "hybrid_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires the local Milvus and Neo4j Compose services"]

