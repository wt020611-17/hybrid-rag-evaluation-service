name: hybrid-rag-stack

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: >-
      etcd --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - rag-etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data --console-address ":9001"
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - rag-minio:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19531:19530"
      - "9092:9091"
    volumes:
      - rag-milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.18
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - rag-neo4j-data:/data
      - rag-neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  indexer:
    profiles: ["index"]
    build: .
    command: ["hybrid-rag", "sync-production"]
    env_file: .env
    environment:
      RAG_PROJECT_ROOT: /app
      PYTHONPATH: /app/src
      BGE_MODEL_PATH: /models/bge-small-zh-v1.5
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    depends_on:
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  api:
    profiles: ["app"]
    build: .
    command: ["uvicorn", "hybrid_rag.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      RAG_MODE: production
      RAG_PROJECT_ROOT: /app
      PYTHONPATH: /app/src
      BGE_MODEL_PATH: /models/bge-small-zh-v1.5
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  rag-etcd:
  rag-minio:
  rag-milvus:
  rag-neo4j-data:
  rag-neo4j-logs:

